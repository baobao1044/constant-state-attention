name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU torch + deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: No CRLF (manifest hashes are byte-level)
        run: python tools/check_line_endings.py

      - name: Manifest is up to date
        run: python tools/make_manifest.py --check

      - name: README tables match results/*.csv
        run: python tools/render_tables.py --check

      - name: Tests
        run: python -m pytest -q

  smoke:
    name: experiments smoke (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: MQAR sweep, 1 seed, tiny
        run: python -m experiments.mqar --seeds 0 --steps 20 --eval-pairs 4 8
      - name: Decode microbenchmark on CPU
        run: python src/bench.py --ckpt weights/hybrid_3of4.pt --seq-lens 512 --batches 1 --steps 4 --no-write
