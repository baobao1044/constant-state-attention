[project]
name = "constant-state-attention"
version = "0.2.0"
description = "Audit and fix of a HDC-attention notebook: rank-1 memory diagnosis, causal constant-state linear attention, hybrid ratio measurements"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", "src/notebook.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# these files must manipulate sys.path before importing the local package
"experiments/*.py" = ["E402", "I001"]
"src/bench.py" = ["E402", "I001"]
"tools/*.py" = ["E402", "I001", "B008"]
